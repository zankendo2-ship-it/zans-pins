name: v5 print-check drafts (hidden, owner-approved, one-shot)
# Runs ONLY when a push to this branch ADDS tools/print_drafts/approval.json (Alex's own yes). No dispatch, no schedule.
on:
  push:
    branches: [zans-social-notes]
    paths: ['tools/print_drafts/approval.json']
concurrency: { group: print-drafts, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Tools for the print gate
        run: pip install -q playwright pillow fonttools brotli uharfbuzz && python -m playwright install --with-deps chromium >/dev/null
      - name: Git identity (the script pushes durable checkpoints)
        run: git config user.name "zans-bot"; git config user.email "zans-bot@users.noreply.github.com"
      - name: Make hidden drafts
        id: run
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINT_DRAFTS_ADDRESS: ${{ secrets.PRINT_DRAFTS_ADDRESS }}
        run: |
          set +e
          python tools/print_drafts/print_drafts.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save state + mock-ups (always)
        if: always()
        run: |
          git add -A tools/print_drafts/reports
          git diff --cached --quiet || git commit -q -m "print drafts: final state"
          ok=0; for i in 1 2 3; do git pull --rebase -q && git push -q && { ok=1; break; }; sleep 5; done
          [ "$ok" = 1 ] || { echo "::error::state push failed"; exit 1; }
      - name: Real result
        if: always()
        run: |
          rc="${{ steps.run.outputs.rc }}"
          echo "print_drafts exit code: ${rc:-none}  (0 COMPLETE, 2 INCOMPLETE/STOPPED, 3 BLOCKED)"
          [ "$rc" = 0 ] || exit 1
