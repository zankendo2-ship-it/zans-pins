# ZANS Claude <-> OpenAI two-reviewer check. PILOT - DISABLED BY DEFAULT.
# Runs only when a person on ZANS_ORCH_ALLOWED_ACTORS starts it by hand (Actions > Run workflow).
# mode=mock is free (no keys, no API calls) and may run while switched off.
# mode=live also needs repository variable ZANS_ORCH_ENABLED = 'true'. Kill switch: set it to anything else.
# No issue_comment / push / schedule triggers, so it can never start itself or loop.
name: ZANS two-reviewer check (pilot)

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number (only 26 is accepted)
        required: true
        default: "26"
        type: choice
        options: ["26"]
      task:
        description: What to review (one or two sentences)
        required: true
      artifacts:
        description: Space-separated TEXT file links pinned to a 40-character commit SHA (no images/video)
        required: true
      rounds:
        description: Review rounds, 1 to 3 (1 round = one Claude call + one OpenAI call). Use 1 for large file sets.
        required: false
        default: "3"
        type: choice
        options: ["1", "2", "3"]
      mode:
        description: mock = dry run, no API calls; live = calls Claude + OpenAI (capped)
        required: true
        default: mock
        type: choice
        options: [mock, live]

concurrency:
  group: zans-orchestrator
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  review:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'mock' || vars.ZANS_ORCH_ENABLED == 'true')
    runs-on: ubuntu-24.04          # pinned image, not ubuntu-latest
    timeout-minutes: 15
    steps:
      # No third-party actions: plain git checkout of this exact commit, the image's own Python.
      - name: Checkout this commit (read-only, no token)
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Dry-run tests (must pass before any call; deps pinned by hash)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --require-hashes --no-deps -r orchestrator/requirements-test.txt
          /tmp/venv/bin/python -m pytest -q orchestrator
      - name: Review
        env:
          ZANS_ORCH_ENABLED: ${{ vars.ZANS_ORCH_ENABLED }}
          ZANS_ORCH_ALLOWED_ACTORS: ${{ vars.ZANS_ORCH_ALLOWED_ACTORS }}
          ZANS_ORCH_MAX_RUNS_PER_DAY: ${{ vars.ZANS_ORCH_MAX_RUNS_PER_DAY }}
          ZANS_ORCH_MAX_USD_PER_RUN: ${{ vars.ZANS_ORCH_MAX_USD_PER_RUN }}
          ZANS_ORCH_MAX_USD_PER_MONTH: ${{ vars.ZANS_ORCH_MAX_USD_PER_MONTH }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ inputs.mode == 'live' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.mode == 'live' && secrets.OPENAI_API_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          ORCH_MODE: ${{ inputs.mode }}
          ORCH_ROUNDS: ${{ inputs.rounds }}
          ORCH_ISSUE: ${{ inputs.issue }}
          ORCH_TASK: ${{ inputs.task }}
          ORCH_ARTIFACTS: ${{ inputs.artifacts }}
        run: /tmp/venv/bin/python orchestrator/orchestrate.py
